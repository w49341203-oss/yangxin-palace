<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="author" content="蕭妤真">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>氧心殿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120a0c; --panel:rgba(28,12,16,.9); --panel2:#24121a; --line:rgba(234,179,8,.28);
  --text:#f7efe2; --dim:#c4b29a; --red:#b91c1c; --gold:#eab308; --gold2:#fde68a; --jade:#34d399; --bad:#f87171;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;cursor:pointer}
.serif{font-family:"Noto Serif TC","Noto Sans TC",serif}
#app{position:fixed;inset:0;overflow:hidden}
/* 背景 */
#bg{position:absolute;inset:0;transition:background .6s}
#bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
#bg img.on{opacity:1}
#bg .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent 55%)}
#bgLabel{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:"Noto Serif TC",serif;font-size:clamp(28px,6vw,64px);font-weight:900;letter-spacing:.3em;color:rgba(253,230,138,.13);pointer-events:none;white-space:nowrap}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:3}
#flash.go{animation:flash 1.6s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:.75}100%{opacity:0}}
/* 立繪 */
#chars{position:absolute;left:0;right:0;bottom:0;height:80%;display:flex;justify-content:center;align-items:flex-end;gap:2%;pointer-events:none;padding:0 4%}
.char{height:100%;flex:0 1 30%;max-width:360px;display:flex;align-items:flex-end;justify-content:center;transition:filter .3s,transform .3s;filter:brightness(.5) saturate(.7);transform:translateY(8px)}
.char.talk{filter:none;transform:none}
.char img{max-height:100%;max-width:100%;object-fit:contain}
/* 上方列 */
#top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:linear-gradient(180deg,rgba(0,0,0,.65),transparent);z-index:5}
#chapWrap{flex:1;min-width:0;display:flex;gap:6px;align-items:center}
.pill{display:inline-block;font-size:clamp(12px,1.7vw,15px);font-weight:700;background:rgba(0,0,0,.55);padding:4px 12px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--line)}
.pill:empty{display:none}
#rankBox{color:var(--gold2)}
#scoreBox{display:none!important;font-weight:900;font-size:clamp(14px,2vw,19px);color:var(--gold);background:rgba(0,0,0,.5);padding:4px 12px;border-radius:999px;border:1px solid rgba(234,179,8,.45);white-space:nowrap}
.iconBtn{background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:10px;min-width:40px;height:38px;font-size:18px}
/* 對話框 */
#box{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);width:min(980px,calc(100% - 24px));
  min-height:clamp(118px,22vh,190px);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px 22px 20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:4;box-shadow:0 10px 40px rgba(0,0,0,.55)}
#box::before{content:"";position:absolute;inset:5px;border:1px solid rgba(234,179,8,.15);border-radius:12px;pointer-events:none}
#name{position:absolute;top:-17px;left:18px;font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(15px,2.2vw,19px);padding:4px 16px;border-radius:8px;background:#444;box-shadow:0 4px 12px rgba(0,0,0,.4)}
#name:empty{display:none}
#text{font-size:clamp(17px,2.5vw,22px);line-height:1.75;min-height:3.5em;white-space:pre-wrap}
#text.narr{color:#e9dcc6}
#next{position:absolute;right:18px;bottom:10px;color:var(--gold);animation:bob 1s infinite;font-size:14px}
@keyframes bob{50%{transform:translateY(4px)}}
/* 覆蓋層 */
.overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,3,5,.75);overflow-y:auto}
.overlay.bottom{align-items:flex-end;background:linear-gradient(0deg,rgba(8,3,5,.6),transparent 60%);padding:0 12px calc(env(safe-area-inset-bottom) + 14px)}
.overlay.bottom .card{width:min(980px,100%);max-height:66%;background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:16px 18px}
body.ovBottom #box{visibility:hidden}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(760px,100%);max-height:calc(100% - 8px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.opts{display:grid;grid-template-columns:1fr;gap:0 10px}
@media (min-width:700px){ .opts.two{grid-template-columns:1fr 1fr} }
.btn{display:block;width:100%;text-align:left;background:#331a22;border:2px solid #5a2f3a;border-radius:12px;padding:12px 16px;margin:7px 0;font-size:clamp(16px,2.3vw,19px);line-height:1.5;transition:transform .1s,background .15s,border-color .15s}
.btn:active{transform:scale(.98)}
.btn.sel{border-color:var(--gold);background:#4a2a12}
.btn.primary{text-align:center;background:linear-gradient(135deg,#b91c1c,#a16207);border:none;font-weight:900}
.btn.ghost{text-align:center;background:transparent}
.btn[disabled]{opacity:.4}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--gold);font-weight:900;flex-wrap:wrap}
.tag{background:rgba(234,179,8,.14);border:1px solid rgba(234,179,8,.45);padding:2px 10px;border-radius:999px;font-size:14px}
.qprompt{font-size:clamp(17px,2.5vw,21px);line-height:1.7;margin:6px 0 4px;white-space:pre-wrap}
.qtip{color:var(--dim);font-size:14px;margin-bottom:4px}
.qfig{display:block;margin:8px auto;max-width:100%;text-align:center}
.qfig svg{max-width:100%;max-height:32vh;height:auto;width:auto;border-radius:12px}
@media (min-width:700px) and (orientation:landscape){
  .card.hasFig .qgrid{display:grid;grid-template-columns:1.05fr 1fr;gap:16px;align-items:start}
  .card.hasFig .opts.two{grid-template-columns:1fr}
  .card.hasFig .qfig svg{max-height:44vh}
  .overlay.bottom .card.hasFig{max-height:76%}
}
.lab{display:inline-block;min-width:1.8em;font-weight:900;color:var(--gold2)}
.seq{min-height:48px;border:2px dashed #6b3a46;border-radius:12px;padding:8px 12px;font-size:21px;font-weight:900;letter-spacing:.2em;margin:8px 0}
/* 每列選一個（選字填空、推理表） */
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 0;border-bottom:1px dashed rgba(234,179,8,.2)}
.mrow .ml{flex:1 1 auto;font-size:clamp(16px,2.3vw,19px)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:#331a22;border:2px solid #5a2f3a;border-radius:10px;padding:8px 14px;font-size:clamp(15px,2.2vw,18px);min-width:56px}
.seg button.sel{border-color:var(--gold);background:#4a2a12;color:var(--gold2);font-weight:900}
/* ＋／－ 表格 */
.grid{display:grid;gap:4px;margin:10px 0;overflow-x:auto}
.grid .h{font-size:14px;color:var(--dim);text-align:center;padding:4px 0}
.grid .rh{font-weight:900;color:var(--gold2);display:flex;align-items:center;justify-content:center;font-size:18px}
.grid button{height:46px;border-radius:8px;border:2px solid #5a2f3a;background:#331a22;font-size:22px;font-weight:900}
.grid button.p{color:#86efac;border-color:#166534} .grid button.m{color:#fca5a5;border-color:#7f1d1d}
.grid button.x{opacity:.5;cursor:default}
.fb{margin-top:8px;font-weight:900;font-size:18px;min-height:1.4em}
.fb.ok{color:var(--jade)} .fb.bad{color:var(--bad)}
.dev{color:#22d3ee;font-size:13px;margin-top:6px;white-space:pre-wrap}
/* 章節卡、標題 */
.chapCard{text-align:center;animation:fade .5s;font-family:"Noto Serif TC",serif}
.chapCard h1{font-size:clamp(26px,5.5vw,48px);margin:0 0 10px;letter-spacing:.12em;color:var(--gold2);text-shadow:0 0 24px rgba(234,179,8,.35)}
.chapCard h2{font-size:clamp(20px,4vw,32px);margin:0;color:#f3e6cf;letter-spacing:.2em}
.chapCard p{color:var(--dim);margin-top:26px;font-family:"Noto Sans TC",sans-serif}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.title h1{font-family:"Noto Serif TC",serif;font-size:clamp(44px,10vw,88px);margin:0;letter-spacing:.2em;text-align:center;color:var(--gold2);text-shadow:0 0 30px rgba(234,179,8,.4)}
.title .subt{text-align:center;color:var(--dim);margin:4px 0 20px}
label.f{display:block;color:var(--dim);font-size:15px;margin:10px 0 4px}
input.name{width:100%;font-size:22px;padding:12px 14px;border-radius:12px;border:2px solid #5a2f3a;background:#1a0b10;color:var(--text);font-family:inherit}
.gender{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gender .btn{text-align:center}
.gender .btn small{display:block;color:var(--dim);font-size:14px}
/* 名帖（抽元素） */
.tie{text-align:center;font-family:"Noto Serif TC",serif}
.tie .sym{font-size:clamp(64px,14vw,120px);font-weight:900;line-height:1;margin:6px 0}
.tie .nm{font-size:clamp(26px,5vw,40px);font-weight:900;letter-spacing:.2em}
.tie .tr{font-family:"Noto Sans TC",sans-serif;color:#e9dcc6;font-size:clamp(15px,2.2vw,18px);line-height:1.7;margin:10px 0}
.tie .tiers{display:inline-block;padding:2px 14px;border-radius:999px;border:1px solid var(--line);color:var(--gold2)}
.series{font-size:clamp(13px,2vw,16px);color:var(--dim);margin:8px 0;letter-spacing:.05em}
.series b{color:var(--gold2);font-size:1.25em}
/* 出招 */
.react{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-bottom:10px}
.rname{padding:3px 12px;border-radius:8px;font-weight:900;color:#1a0b10}
.qprompt.narr{font-style:italic;color:var(--dim)}
.duelHead{font-family:"Noto Serif TC",serif;font-size:clamp(20px,3.5vw,28px);color:var(--gold2);font-weight:900}
.eq{font-size:clamp(17px,2.6vw,22px);background:rgba(0,0,0,.3);border-radius:10px;padding:8px 12px;margin:8px 0;text-align:center}
.rankUp{color:var(--jade);font-weight:900} .rankDown{color:var(--bad);font-weight:900}
/* 成績卡、結局 */
.result{text-align:center}
.result .who{font-size:clamp(22px,4.5vw,34px);font-weight:900;margin:4px 0}
.result .big{font-size:clamp(60px,15vw,120px);font-weight:900;color:var(--gold);line-height:1.1;text-shadow:0 0 30px rgba(234,179,8,.35)}
.result .max{font-size:clamp(17px,3vw,22px);color:var(--dim)}
.endCard{text-align:center;font-family:"Noto Serif TC",serif}
.endCard .endLabel{color:var(--dim);letter-spacing:.5em;font-size:15px}
.endCard h2{font-size:clamp(28px,6vw,46px);margin:6px 0 4px;color:var(--gold2)}
.endDesc{font-family:"Noto Sans TC",sans-serif;color:#efe3cf;font-size:clamp(15px,2.2vw,18px);line-height:1.8;margin:6px 0 10px;white-space:pre-wrap;text-align:left}
.endNew{display:inline-block;color:#1a0b10;background:var(--gold);font-weight:900;border-radius:999px;padding:2px 12px;margin-bottom:6px;font-family:"Noto Sans TC",sans-serif}
.endList{margin:12px 0;text-align:center;font-family:"Noto Sans TC",sans-serif}
.endHead{color:var(--gold);font-weight:900;margin-bottom:8px}
.endChip{display:inline-block;margin:3px;padding:4px 12px;border-radius:999px;border:1px solid #5a2f3a;color:#8a6f6f;font-size:14px}
.endChip.on{color:#fff;border-color:var(--gold);background:rgba(234,179,8,.15)}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:12;background:rgba(0,0,0,.8);border:1px solid var(--line);padding:8px 18px;border-radius:999px;font-weight:900;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
/* 版權宣告 */
.copy{margin-top:12px;font-size:13px;color:var(--dim);text-align:center;letter-spacing:1px}
#ver{position:absolute;right:8px;bottom:2px;font-size:11px;color:rgba(255,255,255,.4);z-index:20;pointer-events:none}
.hidden{display:none!important}
/* 手機橫拿（高度很矮）：字和間距縮小，題目框可以佔滿高度 */
@media (max-height:500px){
  .qprompt{font-size:16px;line-height:1.5} .qtip{font-size:13px}
  .btn{padding:8px 12px;margin:4px 0;font-size:15px}
  .seg button{padding:6px 10px;font-size:15px;min-width:46px} .mrow{padding:4px 0}
  #box{min-height:96px;padding:22px 16px 12px} #text{font-size:16px;line-height:1.6;min-height:2.6em}
  .overlay.bottom{padding:0 8px 6px} .overlay.bottom .card, .overlay.bottom .card.hasFig{max-height:calc(100% - 52px);padding:10px 14px}
  .card.hasFig .qfig svg{max-height:58vh} .grid button{height:38px;font-size:18px}
  .title h1{font-size:40px} .title .subt{margin:0 0 8px} input.name{font-size:18px;padding:8px 12px} .card{padding:14px 18px} .endList{margin:6px 0}
}
#rotate{display:none;position:fixed;inset:0;z-index:100;background:#120a0c;color:#f7efe2;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px}
#rotate .phone{width:64px;height:110px;border:5px solid var(--gold);border-radius:14px;animation:turn 2s ease-in-out infinite}
#rotate b{font-size:22px} #rotate span{color:#c4b29a;font-size:16px;line-height:1.6}
@keyframes turn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){ #rotate{display:flex} }
</style>
</head>
<body>
<div id="app">
  <div id="bg"><img id="bgImg" alt=""><div class="shade"></div><div id="bgLabel"></div></div>
  <div id="chars"></div>
  <div id="flash"></div>
  <div id="top">
    <div id="chapWrap"><span class="pill" id="chap"></span><span class="pill" id="rankBox"></span></div>
    <div id="scoreBox">積分 0</div>
    <button class="iconBtn" id="sndBtn" title="聲音開關">🔊</button>
    <button class="iconBtn" id="fsBtn" title="全螢幕">⛶</button>
    <button class="iconBtn" id="menuBtn" title="選單">☰</button>
  </div>
  <div id="box"><div id="name"></div><div id="text"></div><div id="next">▼</div></div>
  <div id="ov" class="overlay hidden"></div>
  <div id="toast"></div>
  <div id="ver"></div>
  <div id="rotate"><div class="phone"></div><b>請把手機或平板轉成橫向</b><span>這個遊戲只能橫著玩。<br>轉了沒反應的話，<br>請關閉螢幕的「直向鎖定」。</span></div>
</div>

<script src="elements.js?v=1.0"></script>
<script src="core.js?v=1.0"></script>
<script src="figs.js?v=1.0"></script>
<script src="questions.js?v=1.0"></script>
<script src="story.js?v=1.0"></script>
<script>
'use strict';
const VERSION = 'v1.0';
const SAVE_KEY = 'yangxin_save_v1';
const ENDING_KEY = 'yangxin_endings_v1';
const DEV = /[?&]dev=1/.test(location.search);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const { render, condOk, RANKS, START_RANK, resolveKey, nameOf, duelOpponents, duelOutcome, dynQuestion, DUEL_COUNT } = CORE;
const R = s => render(s, S || { ver:'gong', me:'Na', rank:0 });
const MAX_SCORE = QBANK.MAX_STATIC + DUEL_COUNT * 10;
/* 這一局的題目（依 S.seed 產生，每局不同；同一局重新整理不會變） */
let QS = {}, QS_SEED = null;
function ensureQS(){ if (S && QS_SEED !== S.seed) { QS = QBANK.buildQuestions(S); QS_SEED = S.seed; } }

/* ---------- 存檔（壞掉或缺欄位都不會當機） ---------- */
function storeGet(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e){ return null; } }
function storeSet(k, o){ try { localStorage.setItem(k, JSON.stringify(o)); } catch(e){} }
function fixState(s){
  if (!s || typeof s !== 'object' || !ELEMENTS[s.me] || !['gong','zhao'].includes(s.ver)) return null;
  const obj = v => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
  const arr = v => Array.isArray(v) ? v : [];
  return {
    name: String(s.name || ''), ver: s.ver, me: s.me, seed: Number(s.seed) || 1,
    scene: STORY.scenes[s.scene] ? s.scene : STORY.start, idx: Number.isInteger(s.idx) && s.idx >= 0 ? s.idx : 0,
    rank: Math.max(0, Math.min(6, Number.isInteger(s.rank) ? s.rank : START_RANK[ELEMENTS[s.me].tier])),
    done: obj(s.done), missed: obj(s.missed), wrong: Number(s.wrong) || 0, favor: typeof s.favor === 'number' && s.favor >= 0 && s.favor <= 100 ? s.favor : CORE.FAVOR.start, flags: obj(s.flags),
    dyn: obj(s.dyn), duel: s.duel && typeof s.duel === 'object' ? s.duel : null,
    ret: s.ret && typeof s.ret === 'object' ? s.ret : null,
    bg: s.bg || null, show: arr(s.show), chap: typeof s.chap === 'string' ? s.chap : '', needCard: !!s.needCard,
    ended: !!s.ended, endings: arr(s.endings), checkpoints: arr(s.checkpoints),
    plays: Number(s.plays) || 1, playMs: Number(s.playMs) || 0,
  };
}
let S = fixState(storeGet(SAVE_KEY));
function save(){ if (S) storeSet(SAVE_KEY, S); }
function qOf(id){ ensureQS(); return QS[id] || (S.dyn && S.dyn[id]) || null; }
function recalcScore(){ return Object.keys(S.done).reduce((t, k) => { const q = qOf(k); return t + (q && S.done[k] ? (q.pts || 10) : 0); }, 0); }
setInterval(() => { if (S && !document.hidden && !S.ended) { S.playMs += 1000; if (S.playMs % 10000 === 0) save(); } }, 1000);

/* ---------- 聲音：音效用 Web Audio 即時合成（零檔案）；背景音樂讀 music/bgm_*.mp3（沒有檔案就安靜） ---------- */
const SOUND_KEY = 'yangxin_sound_v1';
const SND = { on: storeGet(SOUND_KEY) !== false, ctx: null, master: null, sfx: null, mus: null, cur: '', el: null, elGain: null, want: '' };
function audioInit(){
  if (SND.ctx) { if (SND.ctx.state === 'suspended') SND.ctx.resume(); return true; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
  try {
    SND.ctx = new AC();
    SND.master = SND.ctx.createGain(); SND.master.gain.value = SND.on ? 1 : 0; SND.master.connect(SND.ctx.destination);
    SND.sfx = SND.ctx.createGain(); SND.sfx.gain.value = 0.35; SND.sfx.connect(SND.master);
    SND.mus = SND.ctx.createGain(); SND.mus.gain.value = 0.22; SND.mus.connect(SND.master);
  } catch(e){ SND.ctx = null; return false; }
  if (SND.want) playMusic(SND.want, true);
  return true;
}
/* 手機、平板規定：第一次點畫面之後才能出聲 */
['pointerdown','touchstart','keydown'].forEach(ev => document.addEventListener(ev, audioInit, { passive: true }));
function tone(f, t0, dur, type, vol, f2){
  const c = SND.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(SND.sfx); o.start(t0); o.stop(t0 + dur + 0.05);
}
function pluck(f, t0, vol){ tone(f, t0, 0.9, 'triangle', vol || 0.5); tone(f * 2, t0, 0.35, 'sine', (vol || 0.5) * 0.3); }   // 像古箏撥弦
function noise(t0, dur, vol, fFrom, fTo){
  const c = SND.ctx, n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = c.createBufferSource(); s.buffer = buf;
  const flt = c.createBiquadFilter(); flt.type = 'bandpass'; flt.Q.value = 1.2; flt.frequency.setValueAtTime(fFrom, t0); flt.frequency.exponentialRampToValueAtTime(fTo, t0 + dur);
  const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(flt); flt.connect(g); g.connect(SND.sfx); s.start(t0); s.stop(t0 + dur);
}
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5];   // 五聲音階：宮商角徵羽
function sfx(name){
  if (!SND.on || !SND.ctx) return;
  try {
    const t = SND.ctx.currentTime + 0.01;
    switch (name) {
      case 'tap':    tone(1500, t, 0.05, 'sine', 0.12, 900); break;                      // 翻頁：輕輕的木頭聲
      case 'pick':   pluck(PENTA[3], t, 0.45); break;                                     // 做選擇
      case 'right':  pluck(PENTA[2], t); pluck(PENTA[4], t + 0.09); pluck(PENTA[5], t + 0.18); break;
      case 'wrong':  tone(220, t, 0.35, 'triangle', 0.4, 150); tone(233, t + 0.02, 0.3, 'sine', 0.2, 160); break;
      case 'up':     [0, 1, 2, 3, 5].forEach((k, i) => pluck(PENTA[k], t + i * 0.07, 0.38)); break;
      case 'down':   [5, 3, 2, 1, 0].forEach((k, i) => pluck(PENTA[k] / 2, t + i * 0.09, 0.38)); break;
      case 'drum':   tone(110, t, 0.5, 'sine', 0.9, 45); noise(t, 0.12, 0.25, 900, 200); tone(110, t + 0.22, 0.45, 'sine', 0.7, 45); break;   // 出招：太鼓兩聲
      case 'win':    [0, 2, 4, 5, 7].forEach((k, i) => pluck(PENTA[k], t + i * 0.06, 0.4)); tone(1046.5, t + 0.32, 1.6, 'sine', 0.22); tone(1568, t + 0.32, 1.2, 'sine', 0.1); break;
      case 'lose':   tone(196, t, 0.6, 'triangle', 0.4, 130); tone(98, t + 0.05, 0.7, 'sine', 0.5, 60); break;
      case 'whoosh': noise(t, 0.45, 0.35, 300, 3000); break;                              // 閃光、火焰
      case 'bell':   tone(880, t, 1.8, 'sine', 0.3); tone(1777, t, 1.0, 'sine', 0.1); tone(2637, t, 0.6, 'sine', 0.05); break;
    }
  } catch(e){}
}
/* 背景音樂：淡入淡出切換；檔案不存在就自動安靜 */
const MUSIC = { title:'music/bgm_title.mp3', daily:'music/bgm_daily.mp3', tension:'music/bgm_tension.mp3', duel:'music/bgm_duel.mp3', sad:'music/bgm_sad.mp3', ending:'music/bgm_ending.mp3' };
const musicMissing = {};
function playMusic(name, force){
  SND.want = name;
  if (!SND.ctx || (!force && SND.cur === name)) return;
  SND.cur = name;
  const c = SND.ctx, now = c.currentTime;
  if (SND.el) {
    const oldEl = SND.el, oldG = SND.elGain;
    oldG.gain.cancelScheduledValues(now); oldG.gain.setValueAtTime(oldG.gain.value, now); oldG.gain.linearRampToValueAtTime(0, now + 1.2);
    setTimeout(() => { try { oldEl.pause(); oldG.disconnect(); } catch(e){} }, 1400);
    SND.el = null;
  }
  const src = MUSIC[name]; if (!src || musicMissing[src]) return;
  const el = new Audio(); el.loop = true; el.preload = 'auto';
  el.onerror = () => { musicMissing[src] = true; };
  el.src = src;
  try {
    const node = c.createMediaElementSource(el), g = c.createGain();
    g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(1, now + 1.5);
    node.connect(g); g.connect(SND.mus);
    SND.el = el; SND.elGain = g;
    const p = el.play(); if (p && p.catch) p.catch(() => {});
  } catch(e){}
}
/* 依目前劇情決定配樂 */
function musicForScene(){
  if (!S) return 'title';
  const id = S.scene || '', bg = S.bg || '';
  if (/^(fin_|end_)/.test(id)) return 'ending';
  if (bg === 'cold') return 'sad';
  if (bg === 'fire' || /^(vil_|ch5_)/.test(id)) return 'tension';
  if (/^pro_/.test(id)) return 'title';
  return 'daily';
}

/* 角色代號 → 顯示資料。元素用 ELEMENTS；其他人物在 STORY.people */
function personOf(id){

  const p = STORY.people[k];

  return { key:k, el:false, name:k, color:'#888', sym:'' };
}
const imgOk = {};
const preloaded = {};
function preloadArt(ver){
  if (preloaded[ver]) return; preloaded[ver] = true;
  const list = [];
  Object.entries(STORY.bgs).forEach(([k, b]) => list.push(b.both ? `img/bg_${k}.webp` : `img/bg_${ver}_${k}.webp`));
  const keep = [];
  const ex = ['normal','smug','angry','sad'];
  [...ORDER, 'O', 'qd'].forEach(k => ex.forEach(e => list.push(`img/${ver}_${k}_${e}.webp`)));
  ['S','vi'].forEach(k => ex.forEach(e => list.push(`img/${k}_${e}.webp`)));
  let i = 0;
  const next = () => { if (i >= list.length) return; const im = new Image(); keep.push(im); im.onload = im.onerror = next; im.src = list[i++]; };
  for (let n = 0; n < 4; n++) next();   // 同時 4 張
}
function charFile(p, expr){ return p.both ? `img/${p.key}_${expr}.webp` : `img/${S.ver}_${p.key}_${expr}.webp`; }
function renderChars(speakerKey){
  const box = $('chars'); box.innerHTML = '';
  (S.show || []).forEach(entry => {
    const [id, ex] = String(entry).split(':');
    const p = personOf(id);
    if (p.key === S.me) return;                    // 玩家自己不顯示立繪（第一人稱）
    const d = document.createElement('div');
    d.className = 'char' + (!speakerKey || p.key === speakerKey ? ' talk' : '');
    const tries = [charFile(p, ex || 'normal'), charFile(p, 'normal')].filter((f, i, a) => a.indexOf(f) === i && imgOk[f] !== false);
    const tryNext = () => {
      const f = tries.shift(); if (!f) return;      // 圖真的不存在就留空，不畫替代圖形
      const im = new Image(); im.alt = p.name;
      im.onload = () => { imgOk[f] = true; d.innerHTML = ''; d.appendChild(im); };
      im.onerror = () => { imgOk[f] = false; tryNext(); };
      im.src = f;
      if (im.complete && im.naturalWidth) { imgOk[f] = true; d.appendChild(im); }   // 已預先載入：立刻顯示，不閃
    };
    tryNext();
    box.appendChild(d);
  });
}

/* ---------- 主流程 ---------- */
function goScene(id){
  if (!STORY.scenes[id]) { alert('找不到場景：' + id); return; }
  S.scene = id; S.idx = 0; S.show = [];   // 換場景先清空立繪，由新場景自己 show
  S.needCard = !!(STORY.scenes[id].title || STORY.scenes[id].sub);
  save(); run();
}
function run(){
  closeOv();
  const sc = STORY.scenes[S.scene];
  updateTop(); playMusic(musicForScene());
  if (S.needCard) return showChapterCard(sc);
  for (let guard = 0; guard < 500; guard++) {
    const it = sc.lines[S.idx];
    if (it === undefined) { waitingTap = false; $('text').textContent = '（這段還沒寫完）'; return; }
    if (typeof it === 'string') return showLine(it);
    if (it.when && !condOk(it.when, S)) { S.idx++; continue; }     // 有 when 條件的台詞／動作，條件不合就跳過
    if (it.line) return showLine(it.line);
    if (it.bg !== undefined) { S.bg = it.bg; setBg(it.bg); playMusic(musicForScene()); S.idx++; continue; }
    if (it.show !== undefined) { S.show = it.show.slice(); renderChars(null); S.idx++; continue; }
    if (it.flash) { flash(it.flash === 'me' ? ELEMENTS[S.me].color : it.flash); S.idx++; continue; }
    if (it.set) { Object.assign(S.flags, it.set); S.idx++; continue; }
    if (it.rank) { changeRank(it.rank); S.idx++; continue; }
    if (it.ifgo) { if (condOk(it.ifgo, S)) return goScene(it.go); S.idx++; continue; }
    if (it.q) { if (S.done[it.q] !== undefined || !qOf(it.q)) { S.idx++; continue; } save(); return showQuestion(it.q); }
    if (it.duel) { save(); return runDuel(it); }
    if (it.draw) { save(); return showDraw(); }
    if (it.choice) { save(); return showChoice(it.choice, it.prompt); }
    if (it.ending) { save(); return showEnding(it.ending); }
    if (it.result) { save(); return showResult(true); }
    if (it.rand) {   // 隨機宮中小事件：記下回來的位置，跳去事件場景
      if (CORE.FAVOR.at.includes(it.rand) && !S.flags['_rv' + it.rand]) { save(); return showReview(it.rand); }   // 先由{O}依聖眷審閱
      const ev = CORE.randomEventOf(S, it.rand, STORY.randomEvents);
      S.ret = { scene: S.scene, idx: S.idx + 1, bg: S.bg, chap: S.chap };
      return goScene(ev);
    }
    if (it.ret) {    // 小事件結束：回到原本的劇情
      const rt = S.ret; S.ret = null;
      if (!rt || !STORY.scenes[rt.scene]) { S.idx++; continue; }
      S.scene = rt.scene; S.idx = rt.idx; S.show = []; S.chap = rt.chap || S.chap; S.needCard = false;
      if (rt.bg) { S.bg = rt.bg; setBg(rt.bg); }
      save(); return run();
    }
    if (it.go) return goScene(it.go);
    S.idx++;
  }
}
function changeRank(d){
  const before = S.rank;
  S.rank = Math.max(0, Math.min(6, S.rank + d));
  if (S.rank !== before && !SND.quiet) sfx(S.rank > before ? 'up' : 'down');
  if (S.rank !== before) toast(`${S.rank > before ? '▲ 位分上升' : '▼ 位分下降'}：${RANKS[S.ver][before]} → ${RANKS[S.ver][S.rank]}`);
  updateTop();
}
function showLine(raw){
  const bar = raw.indexOf('|');
  let spk = bar >= 0 ? raw.slice(0, bar) : '', text = bar >= 0 ? raw.slice(bar + 1) : raw, nameOverride = '';
  const bar2 = text.lastIndexOf('|');
  if (bar2 >= 0 && spk === 'x') { nameOverride = text.slice(bar2 + 1); text = text.slice(0, bar2); }
  const [id, ex] = spk.split(':');
  if (id && ex) setExpr(id, ex);
  const nm = $('name');
  let key = null;
  if (id === 'me') { nm.textContent = '你'; nm.style.background = ELEMENTS[S.me].color; nm.style.color = '#1a0b10'; key = S.me; }
  else if (id === 'x') { nm.textContent = R(nameOverride); nm.style.background = '#6b5b4b'; nm.style.color = '#fff'; }
  else if (id) { const p = personOf(id); key = p.key;
    // 說話的人不在畫面上：自動讓他出現（玩家自己除外）
    if (p.key !== S.me && !(S.show || []).some(e => resolveKey(String(e).split(":")[0], S) === p.key)) S.show = [ex ? id + ":" + ex : id]; nm.textContent = p.key === S.me ? '你' : p.name; nm.style.background = p.color; nm.style.color = '#1a0b10'; }
  else nm.textContent = '';
  $('text').className = id ? '' : 'narr';
  renderChars(key);
  typeText(R(text));
  waitingTap = true; save();
}

function lastLineText(){

/* ---------- 出招 ---------- */
function runDuel(it){
  const n = it.duel;
  if (!S.duel || S.duel.n !== n) S.duel = { n, opps: duelOpponents(S, n), pick: undefined, stage: 'pick' };
  const D = S.duel;
  if (D.stage === 'pick') return duelPick(it, D);
  if (D.stage === 'result') return duelResult(it, D);
  if (D.stage === 'q') return duelQuestion(it, D);
}

  const o = openOv(`<div class="card"><div class="qhead"><span class="tag">⚔ 出招</span><span>${esc(R(evOf(it)))}</span></div>

/* ---------- 題目 ---------- */
function shuffleIdx(n, seedStr){
  let h = 2166136261; for (const ch of seedStr) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0; const j = h % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function showQuestion(id, after){
  waitingTap = false; $('next').classList.add('hidden');
  const q = qOf(id); const pts = q.pts || 10;
  const typeName = { single:'單選', multi:'複選', order:'排順序', match:'逐項選擇', grid:'填表' }[q.type] || '';
  const seed = id + ':' + S.seed;                               // 每一局的選項順序都不同（防報答案位置）
  let body = '';
  if (q.type === 'single' || q.type === 'multi') {
    const order = q.noShuffle ? q.options.map((v, i) => i) : shuffleIdx(q.options.length, seed);
    body = (q.type === 'multi' ? '<div class="qtip">可以選不只一個，選好按「送出」</div>' : '') +
      `<div class="opts ${q.options.length >= 4 && q.options.every(t => t.length < 22) ? 'two' : ''}">` + order.map(i => `<button class="btn opt" data-i="${i}">${esc(R(q.options[i]))}</button>`).join('') + '</div>';
  } else if (q.type === 'order') {
    const order = shuffleIdx(q.options.length, seed);
    body = `<div class="qtip">依序點選，由大到小排出來</div><div class="seq" id="seq"></div><div class="opts two">` +
      order.map(i => `<button class="btn opt" data-i="${i}">${esc(R(q.options[i]))}</button>`).join('') + '</div><button class="btn ghost" id="seqReset">重排</button>';
  } else if (q.type === 'match') {
    body = q.rows.map((r, ri) => `<div class="mrow"><div class="ml">${esc(R(r.label))}</div><div class="seg" data-r="${ri}">${r.opts.map((t, oi) => `<button data-o="${oi}">${esc(R(t))}</button>`).join('')}</div></div>`).join('');
  } else if (q.type === 'grid') {
    const n = q.cols.length;
    body = `<div class="qtip">點格子切換 ＋／－（X 是自己，不用填）</div><div class="grid" style="grid-template-columns:44px repeat(${n},minmax(46px,1fr))"><div></div>` +
      q.cols.map(c => `<div class="h">${esc(c)}</div>`).join('') + `<div class="rh">${esc(q.row)}</div>` +
      q.ans.map((a, ci) => a === 'X' ? `<button class="x" disabled>X</button>` : `<button class="cell" data-c="${ci}">？</button>`).join('') + '</div>';
  }
  const needSubmit = q.type !== 'single';
  const figHtml = q.figSvg ? `<div class="qfig">${q.figSvg}</div>` : q.fig && FIGS[q.fig] ? `<div class="qfig">${FIGS[q.fig]}</div>` : '';
  const o = openOv(`<div class="card ${figHtml ? 'hasFig' : ''}">
    <div class="qhead"><span class="tag">${q.dyn ? '奪寵之後' : '宮中考驗'}・${typeName}</span><span id="qpts">只能作答一次</span></div>
    <div class="qgrid"><div class="qleft"><div class="qprompt">${esc(R(q.prompt))}</div>${figHtml}</div>
    <div class="qright">${body}${needSubmit ? '<button class="btn primary" id="submit">送出</button>' : ''}<div class="fb" id="fb"></div>
    ${DEV ? `<div class="dev">【測試】答案：${esc(R(JSON.stringify(q.answer || (q.rows ? q.rows.map(r => r.ans) : q.ans))))}　題號：${id}</div>` : ''}</div></div></div>`, true);
  o.onclick = e => e.stopPropagation();
  const fb = $('fb');
  let locked = false, sel = new Set(), seq = [];
  const pick = {}, cells = {};
  const finish = () => { if (after) after(); else { S.idx++; save(); run(); } };
  const asker = after ? 'O' : CORE.askerOf(STORY.scenes[S.scene].lines, S.idx, S);   // 出招後的題目由{O}問
  const check = ok => {          // Helen：每題只答一次，答完就往下；從對方的反應看出對錯
    if (locked) return; locked = true;
    S.done[id] = ok && !S.missed[id] ? pts : 0;
    if (!ok) { S.missed[id] = true; S.wrong++; }
    S.favor = CORE.favorAfter(S.favor, ok);
    save();
    sfx(ok ? 'right' : 'wrong');
    showReaction(o, CORE.reactLine(S, id, asker, ok), finish);
  };
  o.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (locked) return; const i = +b.dataset.i;
    if (q.type === 'single') { o.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); check(q.options[i] === q.answer); }
    if (q.type === 'multi') { sel.has(i) ? sel.delete(i) : sel.add(i); b.classList.toggle('sel'); }
    if (q.type === 'order' && !seq.includes(i)) { seq.push(i); b.classList.add('sel'); $('seq').textContent = seq.map(k => R(q.options[k])).join(' ＞ '); }
  });
  o.querySelectorAll('.seg').forEach(g => g.querySelectorAll('button').forEach(b => b.onclick = () => {
    if (locked) return; g.querySelectorAll('button').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); pick[+g.dataset.r] = +b.dataset.o;
  }));
  o.querySelectorAll('.cell').forEach(b => b.onclick = () => {
    if (locked) return; const c = +b.dataset.c; const v = cells[c] === '+' ? '-' : '+'; cells[c] = v;
    b.textContent = v === '+' ? '＋' : '－'; b.className = 'cell ' + (v === '+' ? 'p' : 'm');
  });
  const rs = $('seqReset'); if (rs) rs.onclick = () => { seq = []; $('seq').textContent = ''; o.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); };
  const sb = $('submit');
  if (sb) sb.onclick = () => {
    if (q.type === 'multi') { if (!sel.size) return; const g = [...sel].map(i => q.options[i]).sort().join('|'); check(g === [...q.answer].sort().join('|')); }
    if (q.type === 'order') { if (seq.length !== q.options.length) { fb.className = 'fb bad'; fb.textContent = '要全部排完喔'; return; } check(seq.map(i => q.options[i]).join('|') === q.answer.join('|')); }
    if (q.type === 'match') { if (Object.keys(pick).length < q.rows.length) { fb.className = 'fb bad'; fb.textContent = '每一項都要選喔'; return; } check(q.rows.every((r, i) => r.opts[pick[i]] === r.ans)); }
    if (q.type === 'grid') { const need = q.ans.filter(a => a !== 'X').length; if (Object.keys(cells).length < need) { fb.className = 'fb bad'; fb.textContent = '每一格都要填喔'; return; } check(q.ans.every((a, i) => a === 'X' || cells[i] === a)); }
  };
}

    ${has ? `<button class="btn primary" id="tCont">繼續遊戲（${esc(S.name)}・${ELEMENTS[S.me].zh}）</button>` : ''}
    <label class="f">座號＋姓名（成績卡會顯示）</label>
    <input class="name" id="tName" maxlength="20" placeholder="例如：805 王小明" value="${S ? esc(S.name) : ''}">
    <label class="f">${has ? '或者從頭開始一局新的——' : ''}你的性別：</label>
    <div class="gender"><button class="btn" id="tF">女生</button><button class="btn" id="tM">男生</button></div>
    <div class="fb bad" id="tErr"></div>
    ${endingListHtml()}
    <div class="copy">© 2026 蕭妤真　版權所有</div>
  </div>`.replace('{皇上}', '皇上'));
  o.onclick = e => e.stopPropagation();
  if ($('tCont')) $('tCont').onclick = () => { closeOv(); preloadArt(S.ver); setBg(S.bg || 'gate'); renderChars(null); updateTop(); resumeView(); };
  const start = ver => {
    const nm = $('tName').value.trim();
    if (!nm) { $('tErr').textContent = '請先輸入座號＋姓名'; return; }
    if (has) {
      const c = openOv(`<div class="card"><div class="qprompt">確定從頭開始？會重新抽籤，目前進度（積分 ${recalcScore()}）會被清掉。</div>
        <button class="btn primary" id="y">確定</button><button class="btn ghost" id="n">取消</button></div>`);
      c.onclick = e => e.stopPropagation();
      $('y').onclick = () => newGame(nm, ver, plays); $('n').onclick = () => titleScreen();
    } else newGame(nm, ver, plays);
  };
  $('tF').onclick = () => start('gong');
  $('tM').onclick = () => start('zhao');
}
$('ver').textContent = '© 2026 蕭妤真　' + VERSION + (DEV ? '・測試模式' : '');
titleScreen();
</script>
</body>
</html>
